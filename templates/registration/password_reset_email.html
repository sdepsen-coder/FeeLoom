<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f5f7f6;color:#17201f;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f7f6;">
      <tr><td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #dce3df;border-radius:6px;">
          <tr><td style="padding:24px 28px;background:#182522;color:#ffffff;font-size:20px;font-weight:bold;">FeeLoom</td></tr>
          <tr><td style="padding:32px 28px;">
            <p style="margin:0 0 10px;color:#176b55;font-size:12px;font-weight:bold;text-transform:uppercase;">Account security</p>
            <h1 style="margin:0 0 16px;font-size:26px;line-height:1.25;">Reset your password</h1>
            <p style="margin:0 0 24px;color:#65716e;font-size:15px;line-height:1.6;">We received a request to set a new password for your FeeLoom account.</p>
            <p style="margin:0 0 26px;"><a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;padding:12px 18px;border-radius:5px;background:#176b55;color:#ffffff;font-size:15px;font-weight:bold;text-decoration:none;">Reset password</a></p>
            <p style="margin:0;color:#65716e;font-size:13px;line-height:1.6;">If you did not request this, you can safely ignore this email. Your password will not change.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
