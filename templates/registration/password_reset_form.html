{% extends "base.html" %}
{% block title %}Reset password | FeeLoom{% endblock %}
{% block content %}
  <section class="auth-panel">
    <p class="eyebrow">ACCOUNT RECOVERY</p><h1>Reset your password</h1>
    <p class="form-note">Enter your account email. If it matches an active account, FeeLoom will send a reset link.</p>
    <form method="post" class="stack-form">{% csrf_token %}{{ form.as_p }}<button class="primary-button" type="submit">Send reset link</button></form>
    <p class="form-note"><a href="{% url 'login' %}">Back to sign in</a></p>
  </section>
{% endblock %}
